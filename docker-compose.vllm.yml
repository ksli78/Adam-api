version: '3.8'

services:
  # vLLM Inference Server
  # Optimized for Quadro RTX 5000 (Turing architecture)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    ports:
      - "8001:8000"  # vLLM OpenAI-compatible API
    environment:
      # GPU configuration
      - CUDA_VISIBLE_DEVICES=0,1  # Use both GPUs

    command: >
      --model mistralai/Mistral-Small-Instruct-2409
      --tensor-parallel-size 2
      --dtype float16
      --max-model-len 16384
      --gpu-memory-utilization 0.90
      --swap-space 4
      --disable-log-requests
      --port 8000

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2  # Use both Quadro RTX 5000 GPUs
              capabilities: [gpu]

    volumes:
      # Cache HuggingFace models to avoid re-downloading
      - vllm-models:/root/.cache/huggingface

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # Give 5 minutes for model download on first run

  # Adam RAG API (Updated to use vLLM)
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data/airgapped_rag
      - VLLM_HOST=http://vllm:8000  # vLLM OpenAI-compatible endpoint
      - LLM_MODEL=mistralai/Mistral-Small-Instruct-2409
      - LLM_CONTEXT_WINDOW=16384
    volumes:
      - adam-data:/data/airgapped_rag
    networks:
      - adam-network
    depends_on:
      - vllm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  adam-network:
    driver: bridge

volumes:
  adam-data:
    driver: local
  vllm-models:
    name: vllm_models
    driver: local

# NOTES:
# ------
# 1. First startup will download Mistral-Small-Instruct-2409 (~24GB) - takes 10-30 minutes
# 2. --tensor-parallel-size 2: Splits model across both GPUs
# 3. --gpu-memory-utilization 0.90: Uses 90% of each GPU's 16GB (~14.4GB per GPU)
# 4. --max-model-len 16384: Matches your current context window
# 5. --swap-space 4: Uses 4GB CPU RAM as overflow for KV cache
#
# PERFORMANCE EXPECTATIONS (vs Ollama):
# - Single query: 2.5-3.5x faster (45s → 13-18s)
# - 3-5 concurrent: Much better batching, minimal slowdown
# - First request: Slower (model needs to load)
# - Subsequent: Consistent fast performance
#
# ALTERNATIVE MODEL OPTIONS:
# For even faster responses (if Mistral-Small is still too slow):
# - mistralai/Mistral-7B-Instruct-v0.3  (fits in 1 GPU, ~2x faster than Small)
# - meta-llama/Llama-3.1-8B-Instruct     (similar speed to Mistral-7B)
#
# To change models, update both:
# 1. command: --model <new-model>
# 2. LLM_MODEL env var in adam-api service
