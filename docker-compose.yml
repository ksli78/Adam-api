version: '3.8'

# Adam API Docker Compose
# ========================
# This compose file runs the Adam RAG API connecting to Ollama on the host.
# Uses network_mode: host for direct access to host services.
#
# Usage:
#   # Build and start:
#   docker compose up -d --build
#
#   # View logs:
#   docker logs -f adam-api
#
#   # Stop:
#   docker compose down
#
#   # Rebuild after code changes:
#   docker compose up -d --build --force-recreate

services:
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api

    # Use host network - container can access localhost directly
    network_mode: host

    environment:
      - DATA_DIR=/data/airgapped_rag
      # Ollama servers on host's internal ports
      - OLLAMA_HOSTS=http://localhost:21433,http://localhost:21436
      # LLM model configuration (use model installed on Ollama instances)
      - LLM_MODEL=llama3:8b
      - LLM_CONTEXT_WINDOW=32768
      # SQL Server authentication (set in .env file or environment)
      - EMPLOYEE_DB_PASSWORD=${EMPLOYEE_DB_PASSWORD:-}

    # GPU access for embeddings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - adam-data:/data/airgapped_rag

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  adam-data:
    driver: local

# DEPLOYMENT NOTES
# ================
#
# Network Mode: host
#   - Container shares the host's network namespace
#   - Can access localhost:21433 and localhost:21436 directly
#   - API available at http://localhost:8000 (no port mapping needed)
#
# Prerequisites:
#   1. Ollama is running on the host at:
#      - http://localhost:21433 (GPU 0)
#      - http://localhost:21436 (GPU 1)
#   2. The mistral:latest model is installed on both Ollama instances
#
# Optional: SQL Server Integration
#   export EMPLOYEE_DB_PASSWORD=your_password
#   docker compose up -d --build
#
# Troubleshooting:
#   - Check API health: curl http://localhost:8000/health
#   - View logs: docker logs -f adam-api
#   - Test Ollama: curl http://localhost:21433/api/tags
#
# API Endpoints:
#   - Health: http://localhost:8000/health
#   - Docs: http://localhost:8000/docs
#   - Query: POST http://localhost:8000/query
