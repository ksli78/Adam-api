version: '3.8'

# Adam API Docker Compose
# ========================
# This compose file runs the Adam RAG API connecting to external Ollama servers.
# Ollama is running on the remote server with SSL on ports 11433 and 11436.
#
# Usage:
#   # Build and start:
#   docker compose up -d --build
#
#   # View logs:
#   docker logs -f adam-api
#
#   # Stop:
#   docker compose down
#
#   # Rebuild after code changes:
#   docker compose up -d --build --force-recreate

services:
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api
    ports:
      - "8000:8000"

    environment:
      - DATA_DIR=/data/airgapped_rag
      # Remote Ollama servers with SSL (load balanced)
      - OLLAMA_HOSTS=https://adam.amentumspacemissions.com:11433,https://adam.amentumspacemissions.com:11436
      # LLM model configuration
      - LLM_MODEL=mistral:latest
      - LLM_CONTEXT_WINDOW=32768
      # SQL Server authentication (set in .env file or environment)
      - EMPLOYEE_DB_PASSWORD=${EMPLOYEE_DB_PASSWORD:-}

    # GPU access for embeddings (uses both GPUs)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - adam-data:/data/airgapped_rag

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow time for model warmup

networks:
  adam-network:
    driver: bridge

volumes:
  adam-data:
    driver: local

# DEPLOYMENT NOTES
# ================
#
# Prerequisites:
#   1. Ollama is running on remote server at:
#      - https://adam.amentumspacemissions.com:11433 (GPU 0)
#      - https://adam.amentumspacemissions.com:11436 (GPU 1)
#   2. The mistral:latest model is installed on both Ollama instances
#
# Optional: SQL Server Integration
#   Set EMPLOYEE_DB_PASSWORD environment variable before running:
#   export EMPLOYEE_DB_PASSWORD=your_password
#   docker compose up -d --build
#
# Troubleshooting:
#   - Check API health: curl http://localhost:8000/health
#   - View logs: docker logs -f adam-api
#   - Test Ollama connectivity: curl https://adam.amentumspacemissions.com:11433/api/tags
#
# API Endpoints:
#   - Health: http://localhost:8000/health
#   - Docs: http://localhost:8000/docs
#   - Query: POST http://localhost:8000/query
