version: '3.8'

services:
  # Ollama Instance on GPU 0
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    ports:
      - "11434:11434"  # Standard Ollama port

    environment:
      - CUDA_VISIBLE_DEVICES=0  # Only GPU 0
      - OLLAMA_KEEP_ALIVE=-1  # Keep loaded forever (never unload)
      - OLLAMA_NUM_PARALLEL=2  # Handle 2 requests per instance

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']  # GPU 0 only
              capabilities: [gpu]

    volumes:
      - ollama-models:/root/.ollama  # Shared model cache

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow 2 minutes for model loading

  # Ollama Instance on GPU 1
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    ports:
      - "11435:11434"  # Different host port, same container port

    environment:
      - CUDA_VISIBLE_DEVICES=0  # GPU 1 (but CUDA_VISIBLE_DEVICES=0 from container's perspective)
      - OLLAMA_KEEP_ALIVE=-1  # Keep loaded forever (never unload)
      - OLLAMA_NUM_PARALLEL=2  # Handle 2 requests per instance

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']  # GPU 1 only
              capabilities: [gpu]

    volumes:
      - ollama-models:/root/.ollama  # Shared model cache (downloads once)

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow 2 minutes for model loading

  # Adam RAG API (load balances between both Ollama instances)
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api
    ports:
      - "8000:8000"

    environment:
      - DATA_DIR=/data/airgapped_rag
      # Multiple Ollama hosts for load balancing
      - OLLAMA_HOSTS=http://ollama-gpu0:11434,http://ollama-gpu1:11434
      # Use mistral-small:22b (Q4_0 quantization)
      - LLM_MODEL=mistral-small:22b
      - LLM_CONTEXT_WINDOW=8192

    volumes:
      - adam-data:/data/airgapped_rag

    networks:
      - adam-network

    depends_on:
      - ollama-gpu0
      - ollama-gpu1

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # Wait for Ollama containers to be ready first

networks:
  adam-network:
    driver: bridge

volumes:
  adam-data:
    driver: local
  ollama-models:
    driver: local

# DUAL OLLAMA DEPLOYMENT
# ======================
#
# Architecture:
#   - Ollama GPU 0: Port 11434 -> GPU #0
#   - Ollama GPU 1: Port 11435 -> GPU #1
#   - Adam API: Load balances between both instances
#   - Shared model cache (downloads once, both instances use it)
#
# Configuration:
#   - OLLAMA_KEEP_ALIVE=-1: Models never unload (instant responses!)
#   - LLM_MODEL: mistral-small:22b (Q4_0 quantization)
#   - LLM_CONTEXT_WINDOW: 8192 (reduced from 16K for faster prompt processing)
#
# Deployment:
#   ```bash
#   # Restart Ollama containers to apply OLLAMA_KEEP_ALIVE=-1
#   docker compose -f docker-compose.dual-ollama.yml restart ollama-gpu0 ollama-gpu1
#
#   # Verify models are loaded and stay loaded
#   curl http://localhost:11434/api/ps
#   curl http://localhost:11435/api/ps
#   ```
#
# Expected Performance:
#   With OLLAMA_KEEP_ALIVE=-1 fix:
#   - TTFT (first query): ~50s (model loading - one time only)
#   - TTFT (2nd+ queries): <1s (model stays loaded!) ← KEY FIX!
#   - Token generation: 6-10 tok/s (Q4_0 quantization)
#   - Total time (2nd+ queries): ~40s (vs 134s before) = 3.3x faster!
#
#   The keep_alive fix alone saves 40+ seconds per query!
#
# Memory Usage (per GPU):
#   - mistral-small:22b Q4_0: ~12.5GB
#   - Overhead: ~1GB
#   - Total: ~13.5GB per 16GB GPU (fits comfortably!)
#
# Load Balancing:
#   - Round-robin between instances
#   - Each GPU handles requests independently
#   - 2x throughput for concurrent users
#
# Alternative: Switch to Mistral 7B for 3x Faster Tokens
#   If you want even better performance, switch to mistral:latest (7B):
#   - Change LLM_MODEL=mistral:latest
#   - Token generation: 35-50 tok/s (vs 6-10)
#   - Total time: ~12s (vs 40s)
#   - Trade-off: Smaller model but still excellent for RAG
