version: '3.8'

services:
  # Ollama Instance on GPU 0
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    ports:
      - "11434:11434"  # Standard Ollama port

    environment:
      - CUDA_VISIBLE_DEVICES=0  # Only GPU 0
      - OLLAMA_KEEP_ALIVE=-1  # Keep loaded forever (never unload)
      - OLLAMA_NUM_PARALLEL=1  # Single request per GPU to avoid memory pressure

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']  # GPU 0 only
              capabilities: [gpu]

    volumes:
      - ollama-models:/root/.ollama  # Shared model cache

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow 2 minutes for model loading

  # Ollama Instance on GPU 1
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    ports:
      - "11435:11434"  # Different host port, same container port

    environment:
      - CUDA_VISIBLE_DEVICES=0  # GPU 1 (but CUDA_VISIBLE_DEVICES=0 from container's perspective)
      - OLLAMA_KEEP_ALIVE=-1  # Keep loaded forever (never unload)
      - OLLAMA_NUM_PARALLEL=1  # Single request per GPU to avoid memory pressure

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']  # GPU 1 only
              capabilities: [gpu]

    volumes:
      - ollama-models:/root/.ollama  # Shared model cache (downloads once)

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow 2 minutes for model loading

  # Adam RAG API (load balances between both Ollama instances)
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api
    ports:
      - "8000:8000"

    environment:
      - DATA_DIR=/data/airgapped_rag
      # Multiple Ollama hosts for load balancing (remote server with SSL)
      - OLLAMA_HOSTS=https://adam.amentumspacemissions.com:11433,https://adam.amentumspacemissions.com:11436
      # Use mistral:latest 7B (Q4_K_M quantization) - faster and less memory
      - LLM_MODEL=mistral:latest
      - LLM_CONTEXT_WINDOW=32768
      # SQL Server authentication (set in .env file)
      - EMPLOYEE_DB_PASSWORD=${EMPLOYEE_DB_PASSWORD}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

    volumes:
      - adam-data:/data/airgapped_rag

    networks:
      - adam-network

    depends_on:
      - ollama-gpu0
      - ollama-gpu1

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # Wait for Ollama containers to be ready first

networks:
  adam-network:
    driver: bridge

volumes:
  adam-data:
    driver: local
  ollama-models:
    driver: local

# DUAL OLLAMA DEPLOYMENT
# ======================
#
# Architecture:
#   - Ollama GPU 0: Port 11434 -> GPU #0
#   - Ollama GPU 1: Port 11435 -> GPU #1
#   - Adam API: Load balances between both instances
#   - Shared model cache (downloads once, both instances use it)
#
# Configuration:
#   - OLLAMA_KEEP_ALIVE=-1: Models never unload (instant responses!)
#   - LLM_MODEL: mistral:latest 7B (Q4_K_M quantization)
#   - LLM_CONTEXT_WINDOW: 32768 (32K tokens for large contexts)
#
# Deployment:
#   ```bash
#   # Restart Ollama containers to apply OLLAMA_KEEP_ALIVE=-1
#   docker compose -f docker-compose.dual-ollama.yml restart ollama-gpu0 ollama-gpu1
#
#   # Verify models are loaded and stay loaded
#   curl http://localhost:11434/api/ps
#   curl http://localhost:11435/api/ps
#   ```
#
# Expected Performance (mistral:latest 7B Q4_K_M):
#   With OLLAMA_KEEP_ALIVE=-1 and mistral:latest:
#   - TTFT (first query): ~15-20s (model loading - one time only, faster than 22B)
#   - TTFT (2nd+ queries): <1s (model stays loaded!)
#   - Token generation: 35-50 tok/s (Q4_K_M quantization) ← 5x FASTER than mistral-small!
#   - Total time (2nd+ queries): ~12-15s (vs 40s with mistral-small)
#
# Memory Usage (per GPU):
#   - mistral:latest 7B Q4_K_M: ~4GB (vs 12.5GB for 22B)
#   - KV cache (num_ctx=32768): ~2-3GB
#   - Embeddings (e5-large-v2): ~2GB
#   - Overhead: ~1GB
#   - Total: ~9-10GB per 16GB GPU (plenty of headroom!)
#
# Load Balancing:
#   - Round-robin between instances
#   - Each GPU handles requests independently
#   - 2x throughput for concurrent users
#   - Faster responses = better user experience
#
# Why mistral:latest 7B instead of mistral-small 22B?
#   - 5x faster token generation (35-50 vs 6-10 tok/s)
#   - 3x less memory (~4GB vs ~12.5GB)
#   - No OOM errors during document ingestion
#   - Still excellent quality for RAG tasks
#   - Can upgrade to larger models when 90GB GPU arrives
