version: '3.8'

services:
  # Ollama Instance on GPU 0
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    ports:
      - "11434:11434"  # Standard Ollama port

    environment:
      - CUDA_VISIBLE_DEVICES=0  # Only GPU 0
      - OLLAMA_KEEP_ALIVE=-1  # Keep loaded forever (never unload)
      - OLLAMA_NUM_PARALLEL=2  # Handle 2 requests per instance

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']  # GPU 0 only
              capabilities: [gpu]

    volumes:
      - ollama-models:/root/.ollama  # Shared model cache

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow 2 minutes for model loading

  # Ollama Instance on GPU 1
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    ports:
      - "11435:11434"  # Different host port, same container port

    environment:
      - CUDA_VISIBLE_DEVICES=0  # GPU 1 (but CUDA_VISIBLE_DEVICES=0 from container's perspective)
      - OLLAMA_KEEP_ALIVE=-1  # Keep loaded forever (never unload)
      - OLLAMA_NUM_PARALLEL=2  # Handle 2 requests per instance

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']  # GPU 1 only
              capabilities: [gpu]

    volumes:
      - ollama-models:/root/.ollama  # Shared model cache (downloads once)

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow 2 minutes for model loading

  # Adam RAG API (load balances between both Ollama instances)
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api
    ports:
      - "8000:8000"

    environment:
      - DATA_DIR=/data/airgapped_rag
      # Multiple Ollama hosts for load balancing
      - OLLAMA_HOSTS=http://ollama-gpu0:11434,http://ollama-gpu1:11434
      # Use Q4_K_M quantization for optimal performance
      - LLM_MODEL=mistral-small:22b-instruct-q4_k_m
      - LLM_CONTEXT_WINDOW=8192

    volumes:
      - adam-data:/data/airgapped_rag

    networks:
      - adam-network

    depends_on:
      - ollama-gpu0
      - ollama-gpu1

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # Wait for Ollama containers to be ready first

networks:
  adam-network:
    driver: bridge

volumes:
  adam-data:
    driver: local
  ollama-models:
    driver: local

# DUAL OLLAMA DEPLOYMENT
# ======================
#
# Architecture:
#   - Ollama GPU 0: Port 11434 -> GPU #0
#   - Ollama GPU 1: Port 11435 -> GPU #1
#   - Adam API: Load balances between both instances
#   - Shared model cache (downloads once, both instances use it)
#
# Configuration:
#   - OLLAMA_KEEP_ALIVE=-1: Models never unload (instant responses!)
#   - LLM_MODEL: mistral-small:22b-instruct-q4_k_m (Q4_K_M for best performance)
#   - LLM_CONTEXT_WINDOW: 8192 (optimal for prompts ~1170 words)
#
# Deployment:
#   ```bash
#   # Start dual Ollama instances
#   docker compose -f docker-compose.dual-ollama.yml up -d ollama-gpu0 ollama-gpu1
#
#   # Pull the optimized Q4_K_M model on both instances
#   docker exec ollama-gpu0 ollama pull mistral-small:22b-instruct-q4_k_m
#   docker exec ollama-gpu1 ollama pull mistral-small:22b-instruct-q4_k_m
#
#   # Verify models are loaded
#   curl http://localhost:11434/api/ps
#   curl http://localhost:11435/api/ps
#   ```
#
# Expected Performance (after warmup):
#   - TTFT (first query): ~50s (model loading - one time only)
#   - TTFT (all subsequent): <1s (model stays loaded with OLLAMA_KEEP_ALIVE=-1)
#   - Token generation: 15-25 tok/s (Q4_K_M optimization)
#   - Total time: ~12-15s for typical RAG query
#
# Memory Usage (per GPU):
#   - mistral-small:22b Q4_K_M: ~13GB
#   - Overhead: ~1GB
#   - Total: ~14GB per 16GB GPU (fits comfortably!)
#
# Load Balancing:
#   - Round-robin between instances
#   - Each GPU handles requests independently
#   - 2x throughput for concurrent users
