version: '3.8'

services:
  # Text Generation Inference (TGI) - HuggingFace's production inference server
  # Better Turing architecture support than vLLM
  tgi-server:
    image: ghcr.io/huggingface/text-generation-inference:2.0
    container_name: tgi-server
    ports:
      - "8001:80"  # TGI uses port 80 internally

    environment:
      # Model configuration
      - MODEL_ID=ibm-granite/granite-3.1-8b-instruct
      - REVISION=main

      # GPU configuration - Use both GPUs with tensor parallelism
      - NUM_SHARD=2  # Split model across 2 GPUs
      - CUDA_MEMORY_FRACTION=0.85

      # Context and performance
      - MAX_INPUT_LENGTH=8192
      - MAX_TOTAL_TOKENS=12288  # Input + output
      - MAX_BATCH_PREFILL_TOKENS=16384
      - MAX_BATCH_TOTAL_TOKENS=32768

      # Concurrency
      - MAX_CONCURRENT_REQUESTS=4  # Perfect for 3-5 users

      # Optimization
      - DTYPE=float16
      - QUANTIZE=  # No quantization (use full FP16)

      # Logging
      - RUST_LOG=info
      - RUST_BACKTRACE=1

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']  # Both GPUs
              capabilities: [gpu]

    volumes:
      - tgi-data:/data  # Model cache

    networks:
      - adam-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # Allow time for model download

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 32G

  # Adam RAG API (connects to TGI)
  adam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-api
    ports:
      - "8000:8000"

    environment:
      - DATA_DIR=/data/airgapped_rag
      - TGI_HOST=http://tgi-server:80  # TGI endpoint
      - LLM_MODEL=ibm-granite/granite-3.1-8b-instruct
      - LLM_CONTEXT_WINDOW=8192

    volumes:
      - adam-data:/data/airgapped_rag

    networks:
      - adam-network

    depends_on:
      - tgi-server

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  adam-network:
    driver: bridge

volumes:
  adam-data:
    driver: local
  tgi-data:
    name: tgi_models
    driver: local

# TGI DUAL-GPU DEPLOYMENT NOTES
# ==============================
#
# Architecture:
#   - TGI Server: Uses tensor parallelism to split Granite-8B across both GPUs
#   - Adam API: Connects to TGI via http://tgi-server:80
#
# Benefits vs vLLM:
#   ✅ Better Turing architecture support (Quadro RTX 5000)
#   ✅ More stable memory management
#   ✅ Production-ready with monitoring
#   ✅ Official HuggingFace support
#   ✅ Built-in tensor parallelism
#
# Memory Usage (with Granite-8B):
#   - Model split across 2 GPUs: ~5GB per GPU
#   - KV cache: ~2GB per GPU
#   - Overhead: ~1GB per GPU
#   - Total: ~8GB per GPU (plenty of headroom!)
#
# Performance:
#   - Single request: 10-15s (4.5x faster than Ollama 22B)
#   - 2 concurrent: 10-15s each (parallel processing)
#   - 3-5 concurrent: 15-25s (minimal queuing)
#
# Deployment:
#   ```bash
#   # Stop vLLM (if running)
#   docker stop vllm-gpu0 vllm-gpu1 2>/dev/null || true
#
#   # Start TGI
#   docker compose -f docker-compose.tgi.yml up -d tgi-server
#
#   # Monitor startup
#   docker logs -f tgi-server
#
#   # Wait for: "Connected" or "Ready"
#   # First start: 5-10 min (downloads model)
#   # Subsequent: 1-2 min
#   ```
#
# Testing:
#   ```bash
#   # Health check
#   curl http://localhost:8001/health
#
#   # Test generation
#   curl http://localhost:8001/generate \
#     -H "Content-Type: application/json" \
#     -d '{
#       "inputs": "What is 2+2?",
#       "parameters": {
#         "max_new_tokens": 50,
#         "temperature": 0.7
#       }
#     }'
#   ```
#
# GPU Monitoring:
#   ```bash
#   # Watch GPU usage (should show both GPUs active)
#   watch -n 1 nvidia-smi
#
#   # Expected: ~8GB per GPU during inference
#   ```
#
# Smaller Models (if Granite-8B still has issues):
#   Change MODEL_ID to:
#   - microsoft/Phi-3-mini-4k-instruct (4GB total)
#   - Qwen/Qwen2.5-3B-Instruct (3GB total)
#   - HuggingFaceTB/SmolLM2-1.7B-Instruct (2GB total)
#
# Troubleshooting:
#   - If OOM: Reduce NUM_SHARD to 1 (single GPU)
#   - If slow startup: Check docker logs tgi-server
#   - If generation fails: Check MAX_TOTAL_TOKENS settings
